configuration:
  routes:
    name: Routes
    description: >-
      Where the logs are sent, one URI per line, for example gelf://graylog.home:12201.
      Add #name to a route to give it a stable name.
  hostname:
    name: Hostname
    description: The hostname that is sent as part of the logs. Default is homeassistant.
  strip_ansi:
    name: Strip ANSI codes
    description: Remove ANSI color codes from log messages before they are sent.
  env:
    name: Environment variables
    description: Extra environment variables for Logspout, for options that are not available as app options.
  default_rules:
    name: Default rules
    description: >-
      Detect the log level of Home Assistant and common apps. off (default if not set),
      latest (follows the newest set when you update) or v1 (preview, may still change until a release note says it is final).
      Changes the level that is sent to your log system, so it is off until you choose.
  exclude_containers:
    name: Excluded containers
    description: >-
      Container names that are not sent to any route. Wildcards are allowed,
      for example addon_*_mosquitto.
